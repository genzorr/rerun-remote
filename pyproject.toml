[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rerun-remote"
version = "0.4.0"
description = "Open local and SSH-hosted RRD recordings and live streams in the native Rerun desktop viewer"
requires-python = ">=3.11"
dependencies = ["rerun-sdk==0.40.0"]

[project.optional-dependencies]
server = ["datafusion==54.0.0"]

[project.scripts]
rerun-remote = "rerun_remote.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rerun_remote"]
